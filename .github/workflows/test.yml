name: Tests (DevContainer)

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Test inside devcontainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/ci/devcontainer.json
          runCmd: |
            set -euxo pipefail
            rm -rf build
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j
            ctest --test-dir build --output-on-failure -VV
